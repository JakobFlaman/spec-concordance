name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests / Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Anforderungskonvention prüfen / Check requirement conventions
        run: python3 scripts/check-conventions.py openspec/specs openspec/changes

      - name: Übersetzungen prüfen / Check translations
        run: python3 scripts/check-i18n.py

      - name: Markdown prüfen / Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
        continue-on-error: true

      - name: Plugin-Manifest prüfen / Validate plugin manifest
        run: python3 -c "import json; m=json.load(open('.claude-plugin/plugin.json')); assert m['name'] and m['version']"
