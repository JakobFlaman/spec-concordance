name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DO_NOT_TRACK: "1"
  OPENSPEC_VERSION: "1.16.0"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: OpenSpec installieren / Install OpenSpec (fixierte Version)
        run: npm install -g --ignore-scripts "@fission-ai/openspec@${OPENSPEC_VERSION}" && openspec --version

      - name: Tests / Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Anforderungskonvention prüfen / Check requirement conventions
        run: python3 scripts/check-conventions.py

      - name: OpenSpec validieren / Validate OpenSpec
        run: openspec validate --all --strict

      - name: Übersetzungen prüfen / Check translations
        run: python3 scripts/check-i18n.py

      - name: Markdown prüfen / Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
        continue-on-error: true

      - name: Plugin-Manifest prüfen / Validate plugin manifest
        run: python3 -c "import json; m=json.load(open('.claude-plugin/plugin.json')); assert m['name'] and m['version']"
