name: Verbesserung vorschlagen / Suggest an improvement
description: Ein neuer Baustein, eine Rolle, eine Vorlage oder eine Änderung am Vorgehen. / A new building block, role, template or process change.
labels: ["feature", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden? / What problem should be solved?
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Vorschlag / Proposal
    validations:
      required: true
  - type: textarea
    id: alternativen
    attributes:
      label: Betrachtete Alternativen / Alternatives considered
  - type: dropdown
    id: bereich
    attributes:
      label: Bereich / Area
      options:
        - Phasenmodell / Phases
        - Council-Rolle / Council role
        - Qualitäts-Gate / Quality gate
        - Vorlage / Template
        - Dokumentation / Docs
        - Anderes / Other
    validations:
      required: true
